ext><text x="476" y="395.53" fill="#BED1D3" font-size="21" font-weight="400">Арендатор переходит</text><text x="476" y="421.57" fill="#BED1D3" font-size="21" font-weight="400">по confirmation_url</text><rect x="848" y="286" width="368" height="155" fill="#23434E"/><text x="868" y="318.74" fill="#C5AEFF" font-size="18" font-weight="700">3</text><text x="868" y="356.25" fill="#FFFFFF" font-size="25" font-weight="700">Проверить результат</text><text x="868" y="395.53" fill="#BED1D3" font-size="21" font-weight="400">GET /payments/{id}</text><text x="868" y="421.57" fill="#BED1D3" font-size="21" font-weight="400">или проверенный webhook</text><text x="64" y="497.25" fill="#FFFFFF" font-size="25" font-weight="700">/deals</text><text x="64" y="528.67" fill="#BED1D3" font-size="19" font-weight="400">связать расчёты</text><text x="356" y="497.25" fill="#FFFFFF" font-size="25" font-weight="700">/refunds</text><text x="356" y="528.67" fill="#BED1D3" font-size="19" font-weight="400">вернуть оплату</text><text x="648" y="497.25" fill="#FFFFFF" font-size="25" font-weight="700">/payouts</text><text x="648" y="528.67" fill="#BED1D3" font-size="19" font-weight="400">выплатить владельцу</text><text x="940" y="497.25" fill="#FFFFFF" font-size="25" font-weight="700">/receipts</text><text x="940" y="528.67" fill="#BED1D3" font-size="19" font-weight="400">передать данные чека</text><text x="64" y="587.53" fill="#FFFFFF" font-size="21" font-weight="400">Оплата подтверждена по succeeded; возврат на сайт сам по себе её не подтверждает.</text><text x="64" y="623.74" fill="#BED1D3" font-size="18" font-weight="400">При повторе POST сохраняем Idempotence-Key и тело: окно 24 ч. При таймауте сначала сверяем статус.</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#39545E" stroke-width="1.5"/><a href="https://yoomoney.ru/docs/wallet/using-api/format/protocol-request" target="_blank"><text x="64" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">ЮMoney: API кошелька</text></a><a href="https://yookassa.ru/developers/using-api/interaction-format" target="_blank"><text x="221.88671875" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">ЮKassa: формат API</text></a><a href="https://yookassa.ru/developers/payment-acceptance/getting-started/payment-process" target="_blank"><text x="367.345703125" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">Процесс оплаты</text></a><a href="https://yookassa.ru/developers/using-api/webhooks" target="_blank"><text x="486.16796875" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">Уведомления</text></a><text x="1151" y="688.95" fill="#BED1D3" font-size="15" font-weight="400">01 / 09</text></svg></section><section id="slide-2" aria-label="Слайд 2: Sandbox: проверяем путь без реальных денег"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-2"><title id="title-2">Sandbox: проверяем путь без реальных денег</title><rect x="0" y="0" width="1280" height="720" fill="#F6F5F0"/><text x="64" y="47.95" fill="#52636A" font-size="15" font-weight="700">01 · ТЕСТИРОВАНИЕ</text><text x="1080" y="47.95" fill="#52636A" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#6544C8"/><text x="64" y="137.99" fill="#142D38" font-size="43" font-weight="700">Sandbox: проверяем путь без реальных денег</text><text x="64" y="180.46" fill="#52636A" font-size="22" font-weight="400">Для «Безопасной сделки» нужна тестовая интернет-площадка ЮKassa.</text><rect x="64" y="229" width="368" height="308" fill="#FFFFFF" stroke="#D8DEDB"/><rect x="84" y="249" width="148.50439453125" height="30" fill="#E2F1E8"/><text x="96" y="268.95" fill="#236951" font-size="15" font-weight="700">СЕЙЧАС В КОДЕ</text><text x="84" y="320.25" fill="#142D38" font-size="25" font-weight="700">Локальный Simulator</text><text x="84" y="362.53" fill="#52636A" font-size="21" font-weight="400">Работает без ЮKassa.</text><text x="84" y="388.57" fill="#52636A" font-size="21" font-weight="400"></text><text x="84" y="414.60999999999996" fill="#52636A" font-size="21" font-weight="400">Возвращает sim_… и заданный</text><text x="84" y="440.65" fill="#52636A" font-size="21" font-weight="400">успешный результат.</text><text x="84" y="466.68999999999994" fill="#52636A" font-size="21" font-weight="400"></text><text x="84" y="492.72999999999996" fill="#52636A" font-size="21" font-weight="400">Проверяет нашу логику.</text><rect x="456" y="229" width="368" height="308" fill="#FFFFFF" stroke="#D8DEDB"/><rect x="476" y="249" width="173.3115234375" height="30" fill="#EDE7FB"/><text x="488" y="268.95" fill="#6544C8" font-size="15" font-weight="700">СЛЕДУЮЩИЙ ЭТАП</text><text x="476" y="320.25" fill="#142D38" font-size="25" font-weight="700">Sandbox ЮKassa</text><text x="476" y="362.53" fill="#52636A" font-size="21" font-weight="400">Настоящие API-запросы.</text><text x="476" y="388.57" fill="#52636A" font-size="21" font-weight="400"></text><text x="476" y="414.60999999999996" fill="#52636A" font-size="21" font-weight="400">Тестовые shopId, ключ и карты; в</text><text x="476" y="440.65" fill="#52636A" font-size="21" font-weight="400">ответе test: true.</text><text x="476" y="466.68999999999994" fill="#52636A" font-size="21" font-weight="400"></text><text x="476" y="492.72999999999996" fill="#52636A" font-size="21" font-weight="400">Деньги не переводятся.</text><rect x="848" y="229" width="368" height="308" fill="#FFFFFF" stroke="#D8DEDB"/><rect x="868" y="249" width="156.01171875" height="30" fill="#F9EBCD"/><text x="880" y="268.95" fill="#8A5718" font-size="15" font-weight="700">ПОСЛЕ ПРИЁМКИ</text><text x="868" y="320.25" fill="#142D38" font-size="25" font-weight="700">Реальные платежи</text><text x="868" y="362.53" fill="#52636A" font-size="21" font-weight="400">Подключённый продукт.</text><text x="868" y="388.57" fill="#52636A" font-size="21" font-weight="400"></text><text x="868" y="414.60999999999996" fill="#52636A" font-size="21" font-weight="400">Боевые реквизиты; в ответе test:</text><text x="868" y="440.65" fill="#52636A" font-size="21" font-weight="400">false.</text><text x="868" y="466.68999999999994" fill="#52636A" font-size="21" font-weight="400"></text><text x="868" y="492.72999999999996" fill="#52636A" font-size="21" font-weight="400">Движутся реальные деньги.</text><text x="64" y="587.32" fill="#142D38" font-size="24" font-weight="700">Что прогнать в Sandbox</text><text x="64" y="623.53" fill="#52636A" font-size="21" font-weight="400">Успех и отказ  ·  Повтор и таймаут  ·  Оплачена только одна часть  ·  Три исхода залога</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#D8DEDB" stroke-width="1.5"/><a href="https://yookassa.ru/developers/solutions-for-platforms/safe-deal/testing" target="_blank"><text x="64" y="688.16" fill="#52636A" font-size="12" font-weight="400">Sandbox «Безопасной сделки»</text></a><a href="https://yookassa.ru/developers/payment-acceptance/testing-and-going-live/testing" target="_blank"><text x="262.919921875" y="688.16" fill="#52636A" font-size="12" font-weight="400">Ограничения тестового режима</text></a><a href="../payments/simulator.py" target="_blank"><text x="467.171875" y="688.16" fill="#52636A" font-size="12" font-weight="400">Код: simulator.py</text></a><text x="1151" y="688.95" fill="#52636A" font-size="15" font-weight="400">02 / 09</text></svg></section><section id="slide-3" aria-label="Слайд 3: Архитектура: Django-модуль и очередь в БД"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-3"><title id="title-3">Архитектура: Django-модуль и очередь в БД</title><rect x="0" y="0" width="1280" height="720" fill="#F6F5F0"/><text x="64" y="47.95" fill="#52636A" font-size="15" font-weight="700">02 · ПЛАТЁЖНАЯ ЧАСТЬ</text><text x="1080" y="47.95" fill="#52636A" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#6544C8"/><text x="64" y="137.99" fill="#142D38" font-si схода"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-6"><title id="title-6">Залог: отдельная оплата и три исхода</title><rect x="0" y="0" width="1280" height="720" fill="#F6F5F0"/><text x="64" y="47.95" fill="#52636A" font-size="15" font-weight="700">04 · РАБОЧАЯ МОДЕЛЬ ПРОЕКТА</text><text x="1080" y="47.95" fill="#52636A" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#6544C8"/><text x="64" y="137.99" fill="#142D38" font-size="43" font-weight="700">Залог: отдельная оплата и три исхода</text><text x="64" y="180.46" fill="#52636A" font-size="22" font-weight="400">Залог реально списывается отдельно от аренды. Наценки площадки на него нет.</text><rect x="64" y="224" width="560" height="112" fill="#EDE7FB"/><text x="86" y="269.76" fill="#6544C8" font-size="32" font-weight="700">Аренда: 960 ₽</text><text x="86" y="305.53" fill="#142D38" font-size="21" font-weight="400">800 ₽ владельцу + 160 ₽ наценка площадки</text><rect x="648" y="224" width="568" height="112" fill="#E2F1E8"/><text x="670" y="269.76" fill="#236951" font-size="32" font-weight="700">Залог: 3 000 ₽</text><text x="670" y="305.53" fill="#142D38" font-size="21" font-weight="400">Возвратная сумма, учёт отдельно от аренды</text><rect x="64" y="360" width="1152" height="42" fill="#142D38"/><text x="84" y="388.67" fill="#FFFFFF" font-size="19" font-weight="700">Распределение залога</text><text x="586" y="388.67" fill="#FFFFFF" font-size="19" font-weight="700">Арендатору</text><text x="922" y="388.67" fill="#FFFFFF" font-size="19" font-weight="700">Владельцу</text><rect x="64" y="402" width="1152" height="56" fill="#FFFFFF"/><text x="84" y="438.46" fill="#142D38" font-size="22" font-weight="400">Претензий нет</text><text x="586" y="438.46" fill="#142D38" font-size="22" font-weight="700">3 000 ₽</text><text x="922" y="438.46" fill="#142D38" font-size="22" font-weight="700">0 ₽</text><rect x="64" y="458" width="1152" height="56" fill="#ECEFE9"/><text x="84" y="494.46" fill="#142D38" font-size="22" font-weight="400">Подтверждённый ущерб 500 ₽</text><text x="586" y="494.46" fill="#142D38" font-size="22" font-weight="700">2 500 ₽</text><text x="922" y="494.46" fill="#142D38" font-size="22" font-weight="700">500 ₽</text><rect x="64" y="514" width="1152" height="56" fill="#FFFFFF"/><text x="84" y="550.46" fill="#142D38" font-size="22" font-weight="400">Компенсация на весь залог</text><text x="586" y="550.46" fill="#142D38" font-size="22" font-weight="700">0 ₽</text><text x="922" y="550.46" fill="#142D38" font-size="22" font-weight="700">3 000 ₽</text><text x="64" y="615.53" fill="#52636A" font-size="21" font-weight="400">Сумму подтверждают обе стороны или поддержка. Расходы провайдера покрывает площадка;</text><text x="64" y="641.5699999999999" fill="#52636A" font-size="21" font-weight="400">долг за время учитывается отдельно от залога.</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#D8DEDB" stroke-width="1.5"/><a href="../docs/adr/0001-mvp-payment-scope.md" target="_blank"><text x="64" y="688.16" fill="#52636A" font-size="12" font-weight="400">Правила: ADR-0001</text></a><a href="../docs/adr/0003-cancellation-and-refunds.md" target="_blank"><text x="202.421875" y="688.16" fill="#52636A" font-size="12" font-weight="400">Распределение: ADR-0003</text></a><a href="../payments/calculations.py" target="_blank"><text x="379.99609375" y="688.16" fill="#52636A" font-size="12" font-weight="400">Расчёты: calculations.py</text></a><text x="1151" y="688.95" fill="#52636A" font-size="15" font-weight="400">06 / 09</text></svg></section><section id="slide-7" aria-label="Слайд 7: Что уже реализовано для залога"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-7"><title id="title-7">Что уже реализовано для залога</title><rect x="0" y="0" width="1280" height="720" fill="#F6F5F0"/><text x="64" y="47.95" fill="#52636A" font-size="15" font-weight="700">05 · СОСТОЯНИЕ КОДА</text><text x="1080" y="47.95" fill="#52636A" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#6544C8"/><text x="64" y="137.99" fill="#142D38" font-size="43" font-weight="700">Что уже реализовано для залога</text><text x="64" y="180.46" fill="#52636A" font-size="22" font-weight="400">Денежные обязательства и попытки исполнения уже есть; банковское исполнение пока имитируется.</text><rect x="64" y="229" width="276" height="258" fill="#FFFFFF" stroke="#D8DEDB"/><text x="82" y="268.32" fill="#6544C8" font-size="24" font-weight="700">01</text><text x="82" y="309.46" fill="#142D38" font-size="22" font-weight="700">Создать начисления</text><text x="82" y="346.74" fill="#6544C8" font-size="18" font-weight="400">prepare_settlement</text><text x="82" y="393.67" fill="#52636A" font-size="19" font-weight="400">Сохраняет условия.</text><text x="82" y="417.23" fill="#52636A" font-size="19" font-weight="400">Аренда и залог —</text><text x="82" y="440.79" fill="#52636A" font-size="19" font-weight="400">отдельные Charge.</text><rect x="356" y="229" width="276" height="258" fill="#FFFFFF" stroke="#D8DEDB"/><text x="374" y="268.32" fill="#6544C8" font-size="24" font-weight="700">02</text><text x="374" y="309.46" fill="#142D38" font-size="22" font-weight="700">Принять оплату</text><text x="374" y="346.74" fill="#6544C8" font-size="18" font-weight="400">start_payment</text><text x="374" y="393.67" fill="#52636A" font-size="19" font-weight="400">Создаёт попытку</text><text x="374" y="417.23" fill="#52636A" font-size="19" font-weight="400">и команду. Worker</text><text x="374" y="440.79" fill="#52636A" font-size="19" font-weight="400">вызывает Simulator.</text><rect x="648" y="229" width="276" height="258" fill="#FFFFFF" stroke="#D8DEDB"/><text x="666" y="268.32" fill="#6544C8" font-size="24" font-weight="700">03</text><text x="666" y="309.46" fill="#142D38" font-size="22" font-weight="700">Распределить залог</text><text x="666" y="346.74" fill="#6544C8" font-size="18" font-weight="400">reserve_money</text><text x="666" y="393.67" fill="#52636A" font-size="19" font-weight="400">После успешной оплаты:</text><text x="666" y="417.23" fill="#52636A" font-size="19" font-weight="400">решение + резервы</text><text x="666" y="440.79" fill="#52636A" font-size="19" font-weight="400">на возврат и</text><text x="666" y="464.35" fill="#52636A" font-size="19" font-weight="400">компенсацию.</text><rect x="940" y="229" width="276" height="258" fill="#FFFFFF" stroke="#D8DEDB"/><text x="958" y="268.32" fill="#6544C8" font-size="24" font-weight="700">04</text><text x="958" y="309.46" fill="#142D38" font-size="22" font-weight="700">Исполнить части</text><text x="958" y="346.74" fill="#6544C8" font-size="18" font-weight="400">start_outgoing</text><text x="958" y="393.67" fill="#52636A" font-size="19" font-weight="400">Для каждого резерва —</text><text x="958" y="417.23" fill="#52636A" font-size="19" font-weight="400">отдельная попытка</text><text x="958" y="440.79" fill="#52636A" font-size="19" font-weight="400">возврата или выплаты.</text><rect x="64" y="511" width="560" height="129" fill="#E2F1E8"/><text x="84" y="547.39" fill="#236951" font-size="23" font-weight="700">Защита денег</text><text x="84" y="587.53" fill="#142D38" font-size="21" font-weight="400">Суммы — в целых копейках.</text><text x="84" y="613.5699999999999" fill="#142D38" font-size="21" font-weight="400">Нельзя повторно распределить один залог.</text><rect x="648" y="511" width="568" height="129" fill="#F9EBCD"/><text x="668" y="547.39" fill="#8A5718" font-size="23" font-weight="700">Граница реализации</text><text x="668" y="587.53" fill="#142D38" font-size="21" font-weight="400">Резерв — запись в БД, а не банковский холд.</text><text x="668" y="613.5699999999999" fill="#142D38" font-size="21" font-weight="400">Пересмотр резервов пока не реализован.</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#D8DEDB" stroke-width="1.5"/><a href="../payments/services.py" target="_blank"><text x="64" y="688.16" fill="#52636A" font-size="12" font-weight="400">Начисления: services.py</text></a><a href="../payments/reservations.py" target="_blank"><text x="225.484375" y="688.16" fill="#52636A" font-size="12" font-weight="400">Резервы: reservations.py</text></a><a href="../payments/outgoing.py" target="_blank"><text x="389.048828125" y="688.16" fill="#52636A" font-size="12" font-weight="400">Исполнение: outgoing.py</text></a><text x="1151" y="688.95" fill="#52636A" font-size="15" font-weight="400">07 / 09</text></svg></section><section id="slide-8" aria-label="Слайд 8: Для реального залога нужно согласовать схему"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-8"><title id="title-8">Для реального залога нужно согласовать схему</title><rect x="0" y="0" width="1280" height="720" fill="#F6F5F0"/><text x="64" y="47.95" fill="#52636A" font-size="15" font-weight="700">06 · ОГРАНИЧЕНИЯ ПРОВАЙДЕРА</text><text x="1080" y="47.95" fill="#52636A" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#6544C8"/><text x="64" y="137.99" fill="#142D38" font-size="43" font-weight="700">Для реального залога нужно согласовать схему</text><text x="64" y="180.46" fill="#52636A" font-size="22" font-weight="400">Наличие API возврата и выплаты ещё не подтверждает весь сценарий P2P-залога.</text><rect x="64" y="225" width="560" height="259" fill="#FFFFFF" stroke="#D8DEDB"/><rect x="84" y="245" width="213.63134765625" height="30" fill="#EDE7FB"/><text x="96" y="264.95" fill="#6544C8" font-size="15" font-weight="700">«БЕЗОПАСНАЯ СДЕЛКА»</text><text x="84" y="315.39" fill="#142D38" font-size="23" font-weight="700">В одной сделке — один активный</text><text x="84" y="343.90999999999997" fill="#142D38" font-size="23" font-weight="700">или успешный платёж.</text><text x="84" y="390.53" fill="#52636A" font-size="21" font-weight="400">Разница «оплата − сумма владельцу»</text><text x="84" y="416.57" fill="#52636A" font-size="21" font-weight="400">должна быть больше комиссии эквайринга.</text><text x="84" y="442.60999999999996" fill="#52636A" font-size="21" font-weight="400">Схему «3 000 ₽ → все 3 000 ₽ владельцу»</text><text x="84" y="468.65" fill="#52636A" font-size="21" font-weight="400">стандартная инструкция не подтверждает.</text><rect x="648" y="225" width="568" height="259" fill="#FFFFFF" stroke="#D8DEDB"/><rect x="668" y="245" width="276.216796875" height="30" fill="#E2F1E8"/><text x="680" y="264.95" fill="#236951" font-size="15" font-weight="700">КАНДИДАТ ДЛЯ СОГЛАСОВАНИЯ</text><text x="668" y="315.39" fill="#142D38" font-size="23" font-weight="700">Обычный приём залога → возврат</text><text x="668" y="343.90999999999997" fill="#142D38" font-size="23" font-weight="700">+ отдельная выплата владельцу.</text><text x="668" y="390.53" fill="#52636A" font-size="21" font-weight="400">Площадка обеспечивает деньги на возвраты,</text><text x="668" y="416.57" fill="#52636A" font-size="21" font-weight="400">выплаты и комиссии. Балансы раздельные.</text><text x="668" y="442.60999999999996" fill="#52636A" font-size="21" font-weight="400">Назначение залога и условия подключения</text><text x="668" y="468.65" fill="#52636A" font-size="21" font-weight="400">нужно подтвердить у ЮKassa.</text><text x="64" y="531.53" fill="#142D38" font-size="21" font-weight="400">Холд — другой вариант: capture: false, срок до 7 дней; модель проекта требует 14 + 7 суток.</text><text x="64" y="574.53" fill="#142D38" font-size="21" font-weight="400">В Safe Deal возврат возможен до выплаты / закрытия; учитываем фактический expires_at.</text><text x="64" y="617.67" fill="#52636A" font-size="19" font-weight="400">Если выбрана Safe Deal: сначала возврат остатка, затем компенсация. Эта зависимость в модуле ещё не реализована.</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#D8DEDB" stroke-width="1.5"/><a href="https://yookassa.ru/developers/solutions-for-platforms/safe-deal/integration/payments" target="_blank"><text x="64" y="688.16" fill="#52636A" font-size="12" font-weight="400">Safe Deal: оплаты</text></a><a href="https://yookassa.ru/developers/solutions-for-platforms/safe-deal/integration/refunds" target="_blank"><text x="191.3359375" y="688.16" fill="#52636A" font-size="12" font-weight="400">Возвраты</text></a><a href="https://yookassa.ru/developers/payment-acceptance/getting-started/payment-process" target="_blank"><text x="272.359375" y="688.16" fill="#52636A" font-size="12" font-weight="400">Срок холда</text></a><a href="https://yookassa.ru/developers/payouts/overview" target="_blank"><text x="363.30859375" y="688.16" fill="#52636A" font-size="12" font-weight="400">Отдельные выплаты</text></a><a href="yookassa-deposit-research-2026-11-12.md" target="_blank"><text x="506.623046875" y="688.16" fill="#52636A" font-size="12" font-weight="400">Исследование</text></a><text x="1151" y="688.95" fill="#52636A" font-size="15" font-weight="400">08 / 09</text></svg></section><section id="slide-9" aria-label="Слайд 9: Итог: механизм понятен, подключение впереди"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title-9"><title id="title-9">Итог: механизм понятен, подключение впереди</title><rect x="0" y="0" width="1280" height="720" fill="#142D38"/><text x="64" y="47.95" fill="#BED1D3" font-size="15" font-weight="700">07 · РЕЗУЛЬТАТ ЗАДАЧИ</text><text x="1080" y="47.95" fill="#BED1D3" font-size="15" font-weight="400">12.11.2026</text><rect x="64" y="70" width="48" height="5" fill="#BCA5FF"/><text x="64" y="137.99" fill="#FFFFFF" font-size="43" font-weight="700">Итог: механизм понятен, подключение впереди</text><text x="64" y="180.46" fill="#BED1D3" font-size="22" font-weight="400">Исследование отвечает на вопросы API, Sandbox, перехода в live и внутреннего устройства залога.</text><text x="64" y="251.32" fill="#C5AEFF" font-size="24" font-weight="700">API</text><text x="345" y="250.39" fill="#FFFFFF" font-size="23" font-weight="400">Оплаты, возвраты, выплаты, статусы и повторы разобраны.</text><text x="64" y="321.32" fill="#C5AEFF" font-size="24" font-weight="700">Sandbox → live</text><text x="345" y="320.39" fill="#FFFFFF" font-size="23" font-weight="400">Переход спроектирован; настоящий Sandbox ещё не пройден.</text><text x="64" y="391.32" fill="#C5AEFF" font-size="24" font-weight="700">Архитектура</text><text x="345" y="390.39" fill="#FFFFFF" font-size="23" font-weight="400">Django + PostgreSQL + очередь + worker; сейчас Simulator.</text><text x="64" y="461.32" fill="#C5AEFF" font-size="24" font-weight="700">Залог</text><text x="345" y="460.39" fill="#FFFFFF" font-size="23" font-weight="400">Расчёт и резервы есть; банковская схема требует согласования.</text><rect x="64" y="518" width="1152" height="113" fill="#23434E"/><text x="86" y="555.39" fill="#FFFFFF" font-size="23" font-weight="700">Следующие шаги</text><text x="86" y="597.39" fill="#FFFFFF" font-size="23" font-weight="400">1. Согласовать залог и комиссии   2. Подключить ЮKassa   3. Пройти все сценарии Sandbox</text><line x1="64" y1="659" x2="1216" y2="659" stroke="#39545E" stroke-width="1.5"/><a href="../README.md" target="_blank"><text x="64" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">Текущее состояние: README</text></a><a href="payments-api-research-2026-11-07.md" target="_blank"><text x="258.162109375" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">Исследование API</text></a><a href="yookassa-deposit-research-2026-11-12.md" target="_blank"><text x="388.8671875" y="688.16" fill="#BED1D3" font-size="12" font-weight="400">Проверка схемы залога от 12.11</text></a><text x="1151" y="688.95" fill="#BED1D3" font-size="15" font-weight="400">09 / 09</text></svg></section></body></html>
