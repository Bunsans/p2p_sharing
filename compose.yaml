services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: p2p_payments
      POSTGRES_USER: p2p_payments
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build: .
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: p2p_payments
      PGUSER: p2p_payments
      PGPASSWORD: local-development-only
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
