[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-payments"
version = "0.1.0"
description = "Reusable Django payment application for P2P rentals"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["payments*"]
